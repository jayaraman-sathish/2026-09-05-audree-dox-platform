<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audree — AI Business Document Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --ink:#0F1B2D;--ink-2:#1A2A42;--paper:#F5F7F9;--card:#FFF;--line:#DCE3EA;
  --text:#22303F;--muted:#66788A;
  --teal:#0E7C66;--teal-bg:#E4F3EF;--amber:#B4720F;--amber-bg:#FBF1DE;
  --red:#B3382C;--red-bg:#F9E9E7;--blue:#2456C4;--blue-bg:#E8EEFB;
  --violet:#6A45B8;--violet-bg:#EFE9FA;--radius:10px;--mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--text);font-size:13.5px;line-height:1.5}
h1,h2,h3,.brand{font-family:'Sora',sans-serif}
button{font:inherit;cursor:pointer;border:none;background:none}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:230px;min-width:230px;background:var(--ink);color:#C6D2E0;display:flex;flex-direction:column;transition:width .15s,min-width .15s}
.sidebar.collapsed{width:64px;min-width:64px}
.sidebar.collapsed .brand small,.sidebar.collapsed .nav span.t,.sidebar.collapsed .user,.sidebar.collapsed .nav .group{display:none}
.sidebar.collapsed .brand{justify-content:center;font-size:0}
.sidebar.collapsed .brand .dot{width:16px;height:16px}
.sidebar.collapsed .nav button{justify-content:center}
.sidebar.collapsed .nav .badge{position:absolute;top:2px;right:2px;transform:scale(.8)}
.collapse-btn{background:var(--ink-2);border:none;color:#C6D2E0;width:100%;padding:9px 0;font-size:13px;cursor:pointer;border-top:1px solid #24344D}
.collapse-btn:hover{color:#fff}
.brand{padding:20px 18px 14px;color:#fff;font-size:19px;font-weight:700;display:flex;align-items:center;gap:9px}
.brand .dot{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,#3D7BFF,#0E7C66)}
.brand small{font-family:'Inter';font-size:10px;font-weight:500;color:#7E93AC;display:block;letter-spacing:1.4px;text-transform:uppercase}
.nav{padding:8px 10px;flex:1;overflow:auto}
.nav .group{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:#5F7490;margin:16px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;color:#C6D2E0;font-size:13px;text-align:left;margin-bottom:2px}
.nav button:hover{background:var(--ink-2)}
.nav button.active{background:var(--ink-2);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--teal)}
.nav .badge{margin-left:auto;background:var(--amber);color:#fff;font-size:10.5px;font-weight:600;border-radius:9px;padding:1px 7px}
.user{padding:14px 18px;border-top:1px solid #24344D;font-size:12px}
.user b{color:#fff;display:block}
.main{flex:1;overflow:auto;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar h1{font-size:16.5px;color:var(--ink)}
.topbar .sub{color:var(--muted);font-size:12px}
.content{padding:20px 24px 40px;max-width:1440px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2.5px 9px;border-radius:20px;white-space:nowrap}
.chip.teal{background:var(--teal-bg);color:var(--teal)}.chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.red{background:var(--red-bg);color:var(--red)}.chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.violet{background:var(--violet-bg);color:var(--violet)}.chip.grey{background:#EDF1F5;color:var(--muted)}
.btn{padding:8px 15px;border-radius:8px;font-weight:600;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--text)}
.btn:hover{border-color:#B9C4CF}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.primary:hover{background:#0A6853}
.btn.danger{background:#fff;border-color:var(--red);color:var(--red)}.btn.danger:hover{background:var(--red-bg)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{border-color:transparent;color:var(--blue)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:#FAFBFC}
td{padding:10px 14px;border-bottom:1px solid #EDF1F5;vertical-align:middle}
tr.row:hover td{background:#F6F9FC;cursor:pointer}
.mono{font-family:var(--mono);font-size:12px}
.stat{padding:16px 18px}
.stat .n{font-family:'Sora';font-size:26px;font-weight:700;color:var(--ink)}
.stat .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
.grid{display:grid;gap:14px}
.section-title{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff;color:var(--text)}
input:focus,select:focus{outline:2px solid var(--blue-bg);border-color:var(--blue)}
label{font-size:11.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
.filterbar>div{min-width:160px}
.conf{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:500}
.conf .bar{width:44px;height:5px;background:#E6EBF0;border-radius:3px;overflow:hidden}
.conf .bar i{display:block;height:100%;border-radius:3px}
.conf.hi{color:var(--teal)}.conf.hi .bar i{background:var(--teal)}
.conf.md{color:var(--amber)}.conf.md .bar i{background:var(--amber)}
.conf.lo{color:var(--red)}.conf.lo .bar i{background:var(--red)}
.pipe{display:flex;align-items:center;overflow-x:auto;padding:14px 18px}
.pipe .st{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.pipe .st .ic{width:22px;height:22px;border-radius:50%;background:#E9EEF3;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--mono)}
.pipe .st.done{color:var(--teal)}.pipe .st.done .ic{background:var(--teal);color:#fff}
.pipe .st.now{color:var(--ink)}.pipe .st.now .ic{background:var(--blue);color:#fff;box-shadow:0 0 0 4px var(--blue-bg)}
.pipe .ln{width:30px;height:2px;background:var(--line);margin:0 8px;flex:none}
.pipe .ln.done{background:var(--teal)}
.detail{display:grid;grid-template-columns:minmax(340px,1.05fr) minmax(400px,1.3fr);gap:16px;align-items:start}
/* --- original document renderings --- */
.viewtabs{display:flex;gap:6px;margin-bottom:8px}
.viewtabs button{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);background:#fff}
.viewtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pdfframe{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#525659}
.pdfbar{background:#3C4043;color:#E8EAED;font-size:11.5px;padding:7px 12px;display:flex;justify-content:space-between;font-family:var(--mono)}
.pdfpage{background:#fff;margin:16px auto;width:88%;min-height:340px;box-shadow:0 4px 14px rgba(0,0,0,.45);padding:22px 24px;font-size:12px}
.photowrap{border:1px solid var(--line);border-radius:var(--radius);background:radial-gradient(circle at 30% 20%,#8A7A66,#5C5044);padding:26px;display:flex;justify-content:center}
.photo{background:#FDFDF8;width:86%;padding:16px 18px;transform:rotate(-2.2deg);box-shadow:0 10px 22px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.08);font-size:12px}
.photo.card-doc{width:66%;border-radius:10px;background:linear-gradient(135deg,#EAF2FB,#FDFDF8 55%)}
.photo .flash{position:relative}
.hl{background:#FFF3CE;border-bottom:1.5px dashed var(--amber);padding:0 2px;border-radius:2px}
.dochead{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:10px}
/* --- WhatsApp panel --- */
.wa{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.wa .wahead{background:#075E54;color:#fff;padding:9px 14px;font-size:12.5px;display:flex;align-items:center;gap:9px}
.wa .wahead .av{width:26px;height:26px;border-radius:50%;background:#128C7E;display:flex;align-items:center;justify-content:center;font-weight:700}
.wa .wabody{background:#E5DDD5;padding:12px;max-height:280px;overflow:auto}
.wamsg{max-width:82%;background:#fff;border-radius:8px;padding:7px 10px;margin-bottom:7px;font-size:12.5px;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.wamsg.me{margin-left:auto;background:#DCF8C6}
.wamsg .who{font-size:10.5px;color:#128C7E;font-weight:700;margin-bottom:1px}
.wamsg .tm{font-size:9.5px;color:#8696A0;text-align:right;margin-top:2px}
.wamsg .att{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.05);border-radius:6px;padding:7px 9px;margin:3px 0;font-size:12px;cursor:pointer}
.wamsg .att .fic{font-size:19px}
.wafoot{display:flex;gap:8px;padding:9px;background:#F0F2F5}
.wafoot input{border-radius:20px;padding:8px 14px}
.wafoot button{background:#075E54;color:#fff;width:38px;height:38px;border-radius:50%;flex:none;font-size:15px}
.emailthread{padding:12px 14px;font-size:12.5px}
.fieldrow{display:grid;grid-template-columns:1.1fr 1.4fr auto;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid #EDF1F5}
.fieldrow:hover{background:#FAFCFE}
.fieldrow .fname{font-size:12px;font-weight:600;color:var(--muted)}
.fieldrow input{padding:6px 9px;font-size:12.5px}
.fieldrow.err input{border-color:var(--red);background:#FFF7F6}
.valrow{display:flex;gap:10px;padding:9px 14px;border-bottom:1px solid #EDF1F5;font-size:12.5px;align-items:flex-start}
.valrow .vic{width:18px;height:18px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;margin-top:1px}
.valrow.pass .vic{background:var(--teal)}.valrow.fail .vic{background:var(--red)}.valrow.warn .vic{background:var(--amber)}.valrow.pending .vic{background:var(--blue)}.valrow.pending{opacity:.85}
.valrow small{color:var(--muted);display:block}
.actionbar{display:flex;gap:9px;flex-wrap:wrap;padding:14px;border-top:1px solid var(--line);background:#FAFBFC;border-radius:0 0 var(--radius) var(--radius)}
.route-step{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid #EDF1F5;font-size:12.5px}
.route-step .rdot{width:11px;height:11px;border-radius:50%;background:var(--line);margin-top:4px;flex:none}
.route-step.done .rdot{background:var(--teal)}.route-step.now .rdot{background:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(15,27,45,.35);opacity:0;transform:translateY(8px);transition:.25s;z-index:99;max-width:380px}
.toast.show{opacity:1;transform:none}
.wiz{display:flex;overflow-x:auto;margin-bottom:18px}
.wiz button{display:flex;flex-direction:column;gap:3px;padding:10px 14px;border-bottom:3px solid var(--line);font-size:12px;color:var(--muted);min-width:104px;text-align:left}
.wiz button b{font-size:12.5px;color:inherit}
.wiz button .n{font-family:var(--mono);font-size:10px}
.wiz button.active{border-color:var(--blue);color:var(--ink)}
.wiz button.done{border-color:var(--teal);color:var(--teal)}
.rulecard{border:1px solid var(--line);border-radius:8px;padding:10px 13px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12.5px;background:#fff}
.addform{background:#F7FAFD;border:1px dashed #B9CBE4;border-radius:10px;padding:14px;margin-top:10px}
.addform .fr{display:grid;gap:10px;margin-bottom:10px}
.proc-item{padding:12px 14px;border-bottom:1px solid #EDF1F5;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.proc-item:hover{background:#F6F9FC}
.proc-item.sel{background:var(--blue-bg);box-shadow:inset 3px 0 0 var(--blue)}
.vbars{display:flex;align-items:flex-end;gap:18px;height:150px;padding:6px 8px 0}
.vbars .vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.vbars .vb .col{width:100%;max-width:52px;background:linear-gradient(180deg,#3D7BFF,var(--blue));border-radius:6px 6px 0 0;position:relative}
.vbars .vb .col.due{background:linear-gradient(180deg,#E09A2F,var(--amber))}
.vbars .vb .val{font-family:var(--mono);font-size:10.5px;color:var(--ink);font-weight:600}
.vbars .vb .mo{font-size:11px;color:var(--muted);font-weight:600}
.bar-h{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px}
.bar-h .lbl{width:118px;color:var(--muted)}
.bar-h .trk{flex:1;height:9px;background:#E9EEF3;border-radius:5px;overflow:hidden}
.bar-h .trk i{display:block;height:100%;background:var(--blue);border-radius:5px}
.bar-h .v{font-family:var(--mono);width:40px;text-align:right}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:1000px){.detail{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,27,45,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .mhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .mhead h3{font-size:16px;color:var(--ink)}
.modal .mbody{padding:20px}
.modal .mfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:30px 20px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
.dropzone:hover,.dropzone.drag{border-color:var(--blue);background:var(--blue-bg)}
.extract-preview{max-width:100%;max-height:220px;border-radius:8px;margin:0 auto 14px;display:block;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.spinner{width:34px;height:34px;border:3px solid #E6EBF0;border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.livefield{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #EDF1F5;font-size:13px}
.livefield b{color:var(--ink)}
.demo-notes{margin-top:28px;border-top:2px dashed #C9D3DE;padding-top:14px}
.demo-notes .dn-head{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px;cursor:pointer;user-select:none}
.demo-notes .dn-head .tag{background:#EDF1F5;color:var(--muted);border-radius:4px;padding:1px 7px;font-size:10px;letter-spacing:.6px}
.demo-notes ul{margin:0;padding-left:18px;color:var(--muted);font-size:12px;line-height:1.55}
.demo-notes li{margin-bottom:5px}
.demo-notes li b{color:var(--text)}
.demo-notes.collapsed ul{display:none}
</style>

</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="dot"></span><span>Audree<small>AI Business Platform</small></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="user"><b>Priya Nair</b>Shared Services · Reviewer + Owner</div>
    <button class="collapse-btn" id="collapseBtn" onclick="toggleSidebar()" title="Collapse/expand sidebar">◂</button>
  </aside>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ CORE DATA MODEL ============ */
const FUNCS=['Finance','HR','Legal','Logistics','Manufacturing','Quality','Healthcare'];
const TARGETS=['SAP S/4HANA — FI (MIRO)','SAP MM','HRMS (Workday / SAP HCM)','WMS','MES','LIMS','HIMS','DMS only'];
const CHECKTYPES=['Master data lookup','Duplicate check','PO / GRN match','Regex / format','Govt API (GSTN · NSDL · UIDAI)','Value recompute','Range / spec check','Custom condition'];
const USERS=['Priya Nair (Finance)','Arjun Rao (Finance Mgr)','Meera Shah (HR)','Vikram Iyer (Legal)','Sana Qureshi (Logistics)','Naveen Kulkarni (Production)','Dr. Rohit Menon (QA)'];

/* Every document type is a configurable PROCESS: any function, any template, any fields, any target */
const state={
  view:'inbox',selDoc:null,selProc:0,ownerStep:0,mastersTab:0,selMaster:0,
  filters:{func:'All',type:'All',status:'All',channel:'All'},
  processes:[
    proc('P-FIN-01','Vendor Invoice — India GST','Finance','Invoice',['Email','WhatsApp','Vendor portal'],
      tpl('Tax Invoice (GST)',40),
      [pf('Vendor GSTIN','Regex + GSTN API',true,null),pf('Invoice No','Text',true,null),pf('Invoice Date','Date',true,null),pf('PO Reference','Master lookup',false,['Vendor PO Master','PO No']),pf('Taxable Value','Currency',true,null),pf('Total Amount','Currency',true,null)],
      [pr('Duplicate check','Duplicate check','Invoice No + Vendor + Amount within 365 days','Block'),pr('3-way match','PO / GRN match','PO qty vs GRN vs invoice, tolerance 2%','Exception'),pr('GSTIN active','Govt API (GSTN · NSDL · UIDAI)','GSTN portal status = Active','Block'),pr('Tax recompute','Value recompute','Rate × taxable vs extracted tax','Exception')],
      [rt('Amount ≤ ₹2,00,000','AP Desk → Auto-post'),rt('Amount > ₹2,00,000','AP Desk → Finance Manager')],
      'SAP S/4HANA — FI (MIRO)',true,true),
    proc('P-HR-01','Employee KYC — PAN Card','HR','PAN Card',['WhatsApp','Email'],
      tpl('PAN Card (photo)',24),
      [pf('Name on card','Text',true,['Employee Master','Full Name']),pf("Father's Name",'Text',false,null),pf('Date of Birth','Date',true,['Employee Master','DOB']),pf('PAN Number','Regex + NSDL API',true,null)],
      [pr('PAN format','Regex / format','[A-Z]{5}[0-9]{4}[A-Z]','Block'),pr('NSDL status','Govt API (GSTN · NSDL · UIDAI)','PAN active on NSDL','Block'),pr('Name match','Master data lookup','Fuzzy match ≥ 90% vs Employee Master','Exception'),pr('Image quality','Custom condition','Blur / glare score below threshold','Exception')],
      [rt('All documents','HR Ops → HR Manager')],'HRMS (Workday / SAP HCM)',true,true),
    proc('P-HR-02','Employee KYC — Aadhaar','HR','Aadhaar Card',['WhatsApp'],
      tpl('Aadhaar (masked photo)',18),
      [pf('Name','Text',true,['Employee Master','Full Name']),pf('Aadhaar (last 4)','Masked number',true,null),pf('DOB / YOB','Date',true,['Employee Master','DOB']),pf('Address','Text',false,null)],
      [pr('Mask compliance','Custom condition','First 8 digits must be masked (UIDAI norm)','Block'),pr('Verhoeff checksum','Regex / format','Aadhaar checksum valid','Block'),pr('Employee match','Master data lookup','Name + DOB vs Employee Master','Exception')],
      [rt('All documents','HR Ops → HR Manager')],'HRMS (Workday / SAP HCM)',true,true),
    proc('P-LOG-01','Gate Pass — Inbound','Logistics','Gate Pass',['WhatsApp','Email'],
      tpl('Gate Pass (security format)',15),
      [pf('Gate Pass No','Text',true,null),pf('Vehicle No','Regex',true,null),pf('Transporter','Master lookup',true,['Transporter Master','Name']),pf('PO Reference','Master lookup',false,['Vendor PO Master','PO No']),pf('Material / Qty','Text',true,null)],
      [pr('Transporter registered','Master data lookup','Exists + active in Transporter Master','Block'),pr('Vehicle format','Regex / format','Indian RTO plate pattern','Warn'),pr('Open PO','PO / GRN match','PO open with pending qty','Exception')],
      [rt('All documents','Security Desk → Stores → Auto GRN trigger')],'WMS',true,true),
    proc('P-LOG-02','Shipping Note — Outbound','Logistics','Shipping Note',['Email'],
      tpl('Shipping Note',12),

/* ============ CROSS-SESSION PERSISTENCE ============
   Everything above is the default seed data. If the browser has a saved snapshot
   (from a previous visit in this same browser), it overrides the seed data below.
   This is browser-local only — not shared across devices or users, and not a real
   database — but it means uploads, corrections and approvals survive a page reload. */
const STORAGE_KEY='audree_state_snapshot_v1';
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify({docs:state.docs,audit:state.audit,processes:state.processes,masters:state.masters}));
  }catch(e){
    if(!window._storageWarned){
      window._storageWarned=true;
      toast('Browser storage is full — this session still works, but new uploads may not survive a page refresh. Consider Settings \u2192 Reset demo data.');
    }
  }
}
function loadPersistedState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return false;
    const snap=JSON.parse(raw);
    if(snap.docs)state.docs=snap.docs;
    if(snap.audit)state.audit=snap.audit;
    if(snap.processes)state.processes=snap.processes;
    if(snap.masters)state.masters=snap.masters;
    return true;
  }catch(e){ return false; }
}
function resetDemoData(){
  try{localStorage.removeItem(STORAGE_KEY)}catch(e){}
  toast('Demo data reset \u2014 reloading\u2026');
  setTimeout(()=>window.location.reload(),600);
}
loadPersistedState();

function inv(id,party,amount,val,month,invDate,due,paid,overdue,status,invNo,po){
  const isFreight=/freight|logistic|courier|transport/i.test(party);
  const docType=isFreight?'Freight / Logistics Invoice':'Material PO Invoice';
  const hasPO=po&&po!=='\u2014';
  return {id,procId:'P-FIN-01',func:'Finance',type:'Invoice',party,channel:'Email',status,amount,received:invDate,
   fin:{month,invDate,due,val,paid,overdue},attachment:{kind:'pdf',name:id+'.pdf',pages:1},
   fields:[f('Vendor Name',party,97),f('Invoice No',invNo,98),f('Invoice Date',invDate,97),f('PO Reference',hasPO?po:'',hasPO?93:0),f('Total Amount',amount,96),f('Due Date',due,95)],
   checks:[v('pass','Duplicate check','No match in 365 days'),v('pass','GSTIN active','Verified'),v('pass','Mandatory fields','Complete')],
   route:['AP Desk','Finance Manager (>\u20b92L)','Post to SAP FI (MIRO)'],routePos:status==='approved'?3:0,
   sapMatch:{docType,matchBasis:isFreight?'PO based (no GR \u2014 service line)':'PO + GR based',matchType:isFreight?'2-way':'3-way',
     vendor:party,vendorCode:'1'+String(Math.abs(hash(party))%900+100).padStart(5,'0'),poNo:hasPO?po:null,poStatus:hasPO?(status==='approved'?'Closed \u2014 fully invoiced':'Open'):'Not applicable',
     companyCode:'1000',plant:isFreight?'\u2014  (service PO, no plant)':'1100 \u2014 Sri City',paymentTerms:'NET30',
     lines:[{item:'10',material:isFreight?'Freight services':'Material supply per '+(po||'invoice'),
       po:hasPO?{qty:1,uom:'AU',rate:val,value:val}:null,
       gr:hasPO&&!isFreight?{qty:1,uom:'AU',docNo:'50001'+String(Math.abs(hash(id))%90000+10000),date:invDate}:null,
       inv:{qty:1,uom:'AU',rate:val,value:val}}],
     exceptions:[]},
   chat:[m(party.split(' ')[0]+' AP','Invoice '+invNo+' attached for processing.',{kind:'pdf',name:id+'.pdf'})]};
}
function hash(str){let h=0;for(let k=0;k<str.length;k++){h=((h<<5)-h)+str.charCodeAt(k);h|=0}return h}
function sn(id,consignee,qty,carrier,status,note,received){

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2800)}
function log(docId,action,detail,by='Priya Nair'){const d=new Date();state.audit.unshift(aud('08-Jul '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),docId,action,detail,by))}
function statusChip(s){return{pending:'<span class="chip amber">Needs review</span>',exception:'<span class="chip red">Exception</span>',approved:'<span class="chip teal">Approved · Posted</span>',rejected:'<span class="chip red">Rejected</span>',clarify:'<span class="chip violet">Awaiting clarification</span>',routing:'<span class="chip blue">In approval</span>'}[s]||s}
function confHtml(c){const cls=c>=90?'hi':c>=75?'md':'lo';return `<span class="conf ${cls}"><span class="bar"><i style="width:${c}%"></i></span>${c}%</span>`}
function typeIcon(t){return{'Invoice':'🧾','PAN Card':'🪪','Aadhaar Card':'🪪','Gate Pass':'🚚','Shipping Note':'📦','BMR':'🏭','Contract':'📜','COA':'🧪','OPD Sheet':'🏥'}[t]||'📄'}
/* Demo notes: every screen ends with a clearly-separated, collapsible explanatory panel so the working UI stays clean. */
function demoNotes(items){
  return `<div class="demo-notes ${state.demoNotesCollapsed?'collapsed':''}" id="demoNotes">
    <div class="dn-head" onclick="state.demoNotesCollapsed=!state.demoNotesCollapsed;render()"><span class="tag">DEMO NOTES</span> How this screen works <span style="margin-left:auto">${state.demoNotesCollapsed?'▸ show':'▾ hide'}</span></div>
    <ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul>
  </div>`;
}
function attIcon(k){return k==='image'?'🖼️':'📄'}
function procById(id){return state.processes.find(p=>p.id===id)}

const NAV=[['group','Operations'],['inbox','📥','Document Inbox'],['sapap','🧾','SAP AP Automation'],['audit','🛡️','Audit & Analytics'],['group','Application Owner'],['studio','⚙️','Process Studio'],['masters','🗂️','Masters & Mapping']];
function toggleSidebar(){
  const collapsed=!document.getElementById('sidebar').classList.contains('collapsed');
  document.getElementById('sidebar').classList.toggle('collapsed',collapsed);
  document.getElementById('collapseBtn').textContent=collapsed?'▸':'◂';
  try{localStorage.setItem('audree_sidebar_collapsed',collapsed?'1':'0')}catch(e){}
}
function initSidebar(){
  let collapsed=false;
  try{collapsed=localStorage.getItem('audree_sidebar_collapsed')==='1'}catch(e){}
  if(collapsed){document.getElementById('sidebar').classList.add('collapsed');document.getElementById('collapseBtn').textContent='▸'}
}
function renderNav(){
  const pend=state.docs.filter(d=>['pending','exception'].includes(d.status)).length;
  $('nav').innerHTML=NAV.map(n=>n[0]==='group'?`<div class="group">${n[1]}</div>`:
   `<button class="${state.view===n[0]||(state.view==='doc'&&n[0]==='inbox')?'active':''}" onclick="go('${n[0]}')">${n[1]}<span class="t">${n[2]}</span>${n[0]==='inbox'&&pend?`<span class="badge">${pend}</span>`:''}</button>`).join('');

/* ============ REAL, LIVE-COMPUTED CORE INVOICE VALIDATION ============
   Unlike the rest of the seeded "checks" arrays (which are pre-written illustrative text),
   these three run genuinely, every time the document is rendered, against whatever the
   fields currently say — including live edits and live-extracted documents. PO validation
   against SAP cannot be made real client-side; it is shown honestly as pending until the
   live SAP OData connection exists (see Process Studio → Target System). */
function fieldVal(d,name){const f=d.fields.find(x=>x.name.toLowerCase()===name.toLowerCase());return f?f.value.trim():''}
function parseFlexibleDate(s){
  if(!s)return null;
  const cleaned=s.trim();
  let m=cleaned.match(/^(\d{1,2})[-\/\s]([A-Za-z]{3,9}|\d{1,2})[-\/\s](\d{2,4})$/);
  let d;
  if(m){
    const day=+m[1]; const yr=m[3].length===2?2000+ +m[3]:+m[3];
    const monStr=m[2]; let mon;
    if(/^\d+$/.test(monStr)) mon=+monStr-1;
    else { const months=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec']; mon=months.indexOf(monStr.slice(0,3).toLowerCase()); }
    if(mon<0||mon>11)return null;
    d=new Date(yr,mon,day);
    if(d.getFullYear()!==yr||d.getMonth()!==mon||d.getDate()!==day)return null;
    return d;
  }
  const native=new Date(cleaned);
  return isNaN(native.getTime())?null:native;
}
function computeCoreInvoiceChecks(d){
  if(d.type!=='Invoice' && d.type!=='Credit Note')return [];
  const out=[];
  // 0. Template completeness — every mandatory field for THIS invoice type must be present (real, computed live)
  if(d.sapMatch && INVOICE_TEMPLATES[d.sapMatch.docType]){
    const tpl=INVOICE_TEMPLATES[d.sapMatch.docType];
    const missing=tpl.filter(([name,req])=>req && !fieldVal(d,name)).map(([name])=>name);
    if(missing.length) out.push({s:'fail',name:'Template completeness — '+d.sapMatch.docType,detail:'Mandatory field(s) missing for this invoice type: '+missing.join(', ')+'. Extraction ran against the '+d.sapMatch.docType+' template ('+tpl.length+' configured fields).'});
    else out.push({s:'pass',name:'Template completeness — '+d.sapMatch.docType,detail:'All '+tpl.filter(x=>x[1]).length+' mandatory fields of the '+d.sapMatch.docType+' template are present ('+tpl.length+' fields configured in total).'});
  }
  if(d.type==='Credit Note')return out;
  // 1. Invoice Number — mandatory + REAL duplicate check against every other loaded invoice
  const invNo=fieldVal(d,'Invoice No')||fieldVal(d,'Invoice Number');
  if(!invNo){
    out.push({s:'fail',name:'Invoice Number — mandatory',detail:'Field is empty. Invoice Number is required and cannot be posted without it.'});
  }else{
    const dupes=state.docs.filter(o=>o.id!==d.id && o.type==='Invoice' && (fieldVal(o,'Invoice No')||fieldVal(o,'Invoice Number'))===invNo);
    if(dupes.length){
      out.push({s:'fail',name:'Invoice Number — duplicate check (live)',detail:`"${invNo}" also exists on ${dupes.map(x=>x.id).join(', ')} — computed live against ${state.docs.filter(o=>o.type==='Invoice').length} invoices currently loaded, not a scripted result.`});
    }else{
      out.push({s:'pass',name:'Invoice Number — duplicate check (live)',detail:`"${invNo}" is unique across ${state.docs.filter(o=>o.type==='Invoice').length} invoices currently loaded.`});
    }
  }
  // 2. Invoice Date — mandatory + REAL date parse/validity check
  const invDate=fieldVal(d,'Invoice Date');
  if(!invDate){
    out.push({s:'fail',name:'Invoice Date — mandatory',detail:'Field is empty. Invoice Date is required.'});
  }else{
    const parsed=parseFlexibleDate(invDate);
    if(!parsed){
      out.push({s:'fail',name:'Invoice Date — valid date (live)',detail:`"${invDate}" does not parse as a real calendar date.`});
    }else{
      const future=parsed.getTime()>Date.now()+86400000;
      out.push({s:future?'warn':'pass',name:'Invoice Date — valid date (live)',detail:future?`Parses to ${parsed.toDateString()}, which is in the future — check for a typo.`:`Parses correctly to ${parsed.toDateString()}.`});
    }
  }
  // 3. PO Number — mandatory (real) + SAP validation (honestly pending, not faked)
  const po=fieldVal(d,'PO Reference')||fieldVal(d,'PO Number');
  if(!po || po==='—'){
    out.push({s:d.sapMatch&&!d.sapMatch.poNo?'pass':'fail',name:'PO Number — mandatory',detail:d.sapMatch&&!d.sapMatch.poNo?'No PO required for this invoice type ('+d.sapMatch.docType+').':'Field is empty and this invoice type requires a PO.'});
  }else{
    out.push({s:'pass',name:'PO Number — mandatory',detail:`"${po}" present.`});

  }
  return out;
}

function createInvoiceDoc(o){
  const def=INVOICE_TYPE_DEFS[o.docType]||INVOICE_TYPE_DEFS['Material PO Invoice'];
  const id=o.source==='email'?('EML-'+String(emailInvoiceCounter++).padStart(3,'0')):o.source==='live'?('LIVE-'+String(liveDocCounter++).padStart(3,'0')):('MAN-'+String(manualInvoiceCounter++).padStart(3,'0'));
  const amt=parseFloat(String(o.amount).replace(/[^\d.-]/g,''))||0;
  const fields=o.extractedFields&&o.extractedFields.length?o.extractedFields.map(f=>f2(f.name,f.value,f.confidence)):[
    f2('Vendor Name',o.vendor,95),f2('Invoice No',o.invoiceNo,95),f2('Invoice Date',o.invoiceDate,95),
    ...(def.needsPO?[f2('PO Reference',o.poNo||'',o.poNo?90:40)]:[]),
    f2('Total Amount','₹'+amt.toLocaleString('en-IN'),95),
  ];
  const exceptions=[];
  if(def.needsPO && !o.poNo) exceptions.push({type:'Missing PO',severity:'fail',detail:'This invoice type requires a PO reference and none was provided/extracted.'});
  else if(def.needsPO && def.waitLabel) exceptions.push({type:'Awaiting '+def.waitLabel,severity:'warn',detail:'PO "'+o.poNo+'" referenced but no '+def.waitLabel+' posted yet in SAP — 3-way/2-way match cannot complete until it is received. This is a genuine pending state, not an error.'});
  if(o.docType==='Credit Note' && !o.referenceDoc) exceptions.push({type:'Missing reference',severity:'fail',detail:'Credit notes must reference the original invoice being adjusted.'});
  const sapMatch={
    docType:o.docType,matchBasis:def.matchBasis,matchType:def.matchType,
    vendor:o.vendor,vendorCode:'(new — not yet in Vendor Master)',poNo:def.needsPO?(o.poNo||null):null,
    poStatus:def.needsPO?(o.poNo?'Not yet verified — pending SAP connection':'Missing'):'Not applicable',
    companyCode:'1000',plant:'1100 — Sri City',paymentTerms:'Pending vendor master lookup',
    glAccount:o.glAccount||undefined,costCenter:o.costCenter||undefined,assetNo:o.assetNo||undefined,referenceDoc:o.referenceDoc||undefined,
    lines:[{item:'10',material:o.material||o.vendor+' — line item',
      po:def.needsPO&&o.poNo?{qty:1,uom:'EA',rate:amt,value:amt}:null,
      gr:null, ses:null,
      inv:{qty:1,uom:'EA',rate:amt,value:amt}}],
    exceptions,
  };
  const doc={
    id,procId:'P-FIN-01',func:'Finance',type:o.docType==='Credit Note'?'Credit Note':o.docType==='Debit Note'?'Debit Note':'Invoice',
    party:o.vendor,channel:o.source==='email'?'Email':o.source==='live'?'Live Upload':'Manual entry',
    status:exceptions.some(e=>e.severity==='fail')?'exception':'pending',
    amount:(o.docType==='Credit Note'?'−':'')+(o.currency&&o.currency!=='INR'&&o.currency!=='₹'?(o.currency+' '):'₹')+amt.toLocaleString('en-IN'),
    received:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),
    fin:{month:new Date().toLocaleDateString('en-US',{month:'short'}),invDate:o.invoiceDate,due:'—',val:amt,paid:false,overdue:0},
    attachment:o.attachment||{kind:'pdf',name:id+'.pdf',pages:1},
    fields, checks:[{s:'pass',name:'Intake source',detail:o.source==='email'?'Imported live from Gmail inbox (sj.audree@gmail.com)':o.source==='live'?'Uploaded live and read by Veerai against the '+o.docType+' template':'Entered manually by Priya Nair'}],
    route:def.route, routePos:0, sapMatch,
    chat:[m(o.source==='email'?o.vendor:'You',o.chatMsg||(o.source==='email'?'Invoice received by email.':o.source==='live'?'Uploaded live.':'Invoice entered manually into Veerai.'),o.attachment)],
  };
  state.docs.unshift(doc);
  log(id,o.source==='email'?'Invoice imported from Gmail':o.source==='live'?'Invoice uploaded live':'Invoice created manually','Type: '+o.docType+' · Vendor: '+o.vendor,'You');
  return doc;
}

async function pickGmailMessage(i){
  const {token,items}=window._gmailCandidates;
  const msg=items[i];
  $('gmailImportBody').innerHTML=`<div class="spinner"></div><div style="text-align:center;color:var(--muted);font-size:13px">Fetching attachment and reading it with Veerai…</div>`;
  try{
    const full=await (await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+msg.id+'?format=full',{headers:{'Authorization':'Bearer '+token}})).json();
    const h=(full.payload.headers)||[]; const get=n=>(h.find(x=>x.name===n)||{}).value||'';
    const fromHeader=get('From');
    const findAttachment=(parts)=>{
      for(const p of parts||[]){
        if(p.filename && p.body && p.body.attachmentId) return p;
        if(p.parts){const r=findAttachment(p.parts); if(r)return r;}
      }
      return null;
    };
    const part=findAttachment(full.payload.parts);
    if(!part)throw new Error('No attachment found on this message');
    const attResp=await (await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+msg.id+'/attachments/'+part.body.attachmentId,{headers:{'Authorization':'Bearer '+token}})).json();
    const base64=attResp.data.replace(/-/g,'+').replace(/_/g,'/');
    const mimeType=part.mimeType||'application/pdf';
    const extracted=await extractWithGemini(base64,mimeType);
    const guessedType=guessInvoiceType(extracted);
    window._gmailPending={extracted,base64,mimeType,fromHeader,filename:part.filename};
    renderGmailExtractedPreview(extracted,guessedType,fromHeader,part.filename,mimeType,base64);
  }catch(e){
    $('gmailImportBody').innerHTML='<div style="color:var(--red);font-size:13px">Could not import: '+esc(e.message)+'</div>';
  }
}
function guessInvoiceType(extracted){
  const blob=(extracted.documentType+' '+extracted.fields.map(f=>f.name+' '+f.value).join(' ')).toLowerCase();
  if(blob.includes('credit note')||blob.includes('credit memo'))return 'Credit Note';
  if(blob.includes('debit note')||blob.includes('debit memo'))return 'Debit Note';
  if(blob.includes('subscription')||blob.includes('license')||blob.includes('order form')||blob.includes('named user')||blob.includes('billing period')||blob.includes('saas'))return 'Subscription / License Invoice';
  if(blob.includes('calibrat')||blob.includes('amc')||blob.includes('service entry')||blob.includes('consult')||blob.includes('project and maint')||blob.includes('sac code'))return 'Service PO Invoice';
  if(blob.includes('freight')||blob.includes('transport')||blob.includes('courier')||blob.includes('hwb')||blob.includes('awb')||blob.includes('job no')||blob.includes('job number'))return 'Freight / Logistics Invoice';
  if(blob.includes('asset')||blob.includes('equipment')||blob.includes('machinery'))return 'Asset / Capex Invoice';
  if(blob.includes('hsn code')||blob.includes('batch no')||blob.includes('grn')||blob.includes('material'))return 'Material PO Invoice';
  if(blob.includes('electric')||blob.includes('utility')||blob.includes('statutory'))return 'Direct / Non-PO Invoice';
  if(!blob.includes('po ')&&!blob.includes('purchase order'))return 'Direct / Non-PO Invoice';
  return 'Material PO Invoice';
}

function act(id,kind){
  const d=state.docs.find(x=>x.id===id);const p=procById(d.procId);

  if(kind==='reject'){d.status='rejected';log(id,'Rejected','Returned to sender with reasons');toast('Rejected and sender notified')}

const SAP_PIPE=['Capture','Extract','Classify','Select Template','Extract Fields','Validate','Match with SAP','Resolve Exceptions','Approve','Park in SAP','Post in SAP','Payment'];
const INVOICE_TYPE_CHIP={'Material PO Invoice':'blue','Service PO Invoice':'violet','Direct / Non-PO Invoice':'amber','Freight / Logistics Invoice':'teal','Asset / Capex Invoice':'red','Subscription / License Invoice':'violet','Credit Note':'grey','Debit Note':'grey'};
function sapStage(d){
  if(d.status==='approved')return 10;
  if(!d.sapMatch)return 5;
  if(d.sapMatch.exceptions.length && d.status!=='routing')return 7;
  if(d.status==='routing')return 8;
  return 6;
}
function renderSapAp(){
  const invs=state.docs.filter(d=>d.procId==='P-FIN-01');
  const withMatch=invs.filter(d=>d.sapMatch);
  const exCount=withMatch.reduce((s,d)=>s+d.sapMatch.exceptions.length,0);

function sapMatchPanel(d){
  const m=d.sapMatch; if(!m)return '';
  const hasGR=m.lines.some(l=>l.gr);
  const hasSES=m.lines.some(l=>l.ses);
  const thirdColLabel = hasSES ? 'Service Entry Sheet' : (hasGR ? 'Goods Receipt' : (m.poNo ? 'Goods Receipt' : 'N/A'));
  const rows=m.lines.map(l=>{
    const poVal=l.po?l.po.value:null, invVal=l.inv.value;
    const qtyVariant=l.gr && l.po && l.gr.qty!==l.inv.qty;
    const priceVariant=l.po && Math.abs(l.po.rate-l.inv.rate)>0.01;
    const poCell = l.po
      ? `${l.po.qty} ${l.po.uom} @ \u20b9${l.po.rate.toLocaleString('en-IN')}<br><small style="color:var(--muted)">\u20b9${poVal.toLocaleString('en-IN')}</small>`
      : `<span style="color:var(--muted)">\u2014 no PO (${esc(m.matchBasis)})</span>`;
    const midCell = l.ses
      ? `SES accepted<br><small style="color:var(--muted)">${esc(l.ses.docNo)} \u00b7 ${esc(l.ses.date)}<br>by ${esc(l.ses.acceptedBy)}</small>`
      : l.gr
        ? `${l.gr.qty} ${l.gr.uom}<br><small style="color:var(--muted)">GR ${esc(l.gr.docNo)} \u00b7 ${esc(l.gr.date)}</small>`
        : `<span style="color:var(--muted)">\u2014 not applicable</span>`;
    return `<tr>
      <td>${esc(l.item)} \u00b7 ${esc(l.material)}</td>
      <td class="mono">${poCell}</td>
      <td class="mono">${midCell}</td>
      <td class="mono" style="${qtyVariant||priceVariant?'color:var(--red);font-weight:600':''}">${l.inv.qty} ${l.inv.uom} @ \u20b9${l.inv.rate.toLocaleString('en-IN')}<br><small>\u20b9${invVal.toLocaleString('en-IN')}</small></td>
    </tr>`;
  }).join('');
  const glCcRow = m.glAccount ? `<span><b style="color:var(--ink)">GL account</b> ${esc(m.glAccount)}</span><span><b style="color:var(--ink)">Cost centre</b> ${esc(m.costCenter)}</span>` : '';
  const assetRow = m.assetNo ? `<span><b style="color:var(--ink)">Asset (AUC)</b> ${esc(m.assetNo)}</span>` : '';
  const refRow = m.referenceDoc ? `<span><b style="color:var(--ink)">Reference document</b> ${esc(m.referenceDoc)}</span>` : '';
  return `
   <div class="section-title">SAP match \u2014 <span class="chip ${INVOICE_TYPE_CHIP[m.docType]||'grey'}">${esc(m.docType)}</span> \u00b7 ${esc(m.matchType)} \u00b7 Vendor ${esc(m.vendorCode)}${m.poNo?' \u00b7 '+esc(m.poNo)+' ('+esc(m.poStatus)+')':' \u00b7 no PO'}</div>
   <div class="card" style="margin-bottom:16px">
    <div style="padding:10px 14px;font-size:12px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line)">
      <span><b style="color:var(--ink)">Company code</b> ${esc(m.companyCode)}</span>
      <span><b style="color:var(--ink)">Plant</b> ${esc(m.plant)}</span>
      <span><b style="color:var(--ink)">Payment terms</b> ${esc(m.paymentTerms)}</span>
      ${glCcRow}${assetRow}${refRow}
    </div>
    <table><thead><tr><th>Line item</th><th>Purchase Order</th><th>${thirdColLabel}</th><th>Invoice</th></tr></thead><tbody>${rows}</tbody></table>
   </div>
   ${m.exceptions.length?`
   <div class="section-title" style="color:var(--red)">AP exceptions \u2014 ${m.exceptions.length} to resolve before parking</div>
   <div class="card" style="margin-bottom:16px">${m.exceptions.map(e=>`<div class="valrow ${e.severity}"><span class="vic">${e.severity==='fail'?'\u2715':'!'}</span><div><b>${esc(e.type)}</b><small>${esc(e.detail)}</small></div></div>`).join('')}</div>`
   :`<div class="card" style="margin-bottom:16px;padding:12px 14px"><span class="chip teal">\u2713 Clean match \u2014 PO/GL valid, eligible to park in SAP</span></div>`}
  `;
}

async function handleLiveFile(file){
  if(!file)return;
  if(!getApiKey()){
    $('liveResult').innerHTML=`<div style="color:var(--red);padding:14px;background:var(--red-bg);border-radius:8px;font-size:13px"><b>No API key set.</b> Open ⚙️ Settings and paste your free key first — it didn't seem to save last time. Try pasting it, clicking Save, then reopening Settings to confirm it still shows.</div>`;
    return;
  }
  const isPdf=file.type==='application/pdf';
  const reader=new FileReader();
  reader.onload=async()=>{
    const base64=reader.result.split(',')[1];
    $('liveResult').innerHTML=`
     ${isPdf?'<div style="text-align:center;color:var(--muted);margin-bottom:10px">📄 '+esc(file.name)+'</div>':`<img class="extract-preview" src="${reader.result}">`}
     <div class="spinner"></div>
     <div style="text-align:center;color:var(--muted);font-size:13px">Veerai is reading the document…</div>`;
    try{
      // PASS 1 — classify (no field extraction yet)
      const cls=await classifyWithGemini(base64,file.type);
      const isInvoice=(cls.category==='Invoice'||cls.category==='Credit Note'||cls.category==='Debit Note')&&cls.invoiceType&&INVOICE_TEMPLATES[cls.invoiceType];
      if(isInvoice){
        // PASS 2 — extract ONLY the configured fields of that type's template
        $('liveResult').innerHTML=`
         ${isPdf?'<div style="text-align:center;color:var(--muted);margin-bottom:10px">📄 '+esc(file.name)+'</div>':`<img class="extract-preview" src="${reader.result}">`}
         <div class="spinner"></div>
         <div style="text-align:center;color:var(--muted);font-size:13px">Classified as <b>${esc(cls.invoiceType)}</b> — extracting its ${INVOICE_TEMPLATES[cls.invoiceType].length} configured fields…</div>`;
        const fields=await extractTemplateWithGemini(base64,file.type,cls.invoiceType);
        renderLiveResult({documentType:cls.invoiceType,party:cls.party,fields,classification:cls,isInvoice:true},reader.result,file.name,isPdf);
        Object.assign(window._pendingLiveDoc,{_base64:base64,_mime:file.type,_dataUrl:reader.result});
      }else{
        const generic=await extractWithGemini(base64,file.type);
        generic.classification=cls; generic.isInvoice=false;
        renderLiveResult(generic,reader.result,file.name,isPdf);
        Object.assign(window._pendingLiveDoc,{_base64:base64,_mime:file.type,_dataUrl:reader.result});
      }
    }catch(err){
      const isFileProtocol=window.location.protocol==='file:';
      const isNetworkFail=err instanceof TypeError && /fetch/i.test(err.message);
      let hint='Check that your API key (⚙️ settings) is valid and has quota remaining.';
      if(isNetworkFail && isFileProtocol){
        hint=`<b>Likely cause:</b> you opened this file directly from disk (file://…). Google's API blocks requests from local files for security. <b>Fix:</b> host this file on a real URL — drag it onto <a href="https://app.netlify.com/drop" target="_blank" style="color:var(--blue)">app.netlify.com/drop</a> (free, 30 seconds) and open it from the URL it gives you instead of double-clicking the file.`;
      }else if(isNetworkFail){
        hint='This looks like a network/CORS-level failure rather than an API error — check your internet connection, and confirm this page is loaded from a real https:// URL rather than a local file.';
      }else if(err.status===503){
        hint=`<b>This is on Google's side, not yours.</b> All backup models were also overloaded right now — your API key is fine. Wait 30–60 seconds and try the upload again; these spikes are usually brief.`;
      }else if(err.status===429){
        hint=`<b>Rate limit hit.</b> Your free-tier key has a per-minute request cap and you've exceeded it — wait about a minute and try again. If this happens often, a paid tier removes the cap.`;
      }else if(err.status===400||err.status===403){
        hint=`<b>The API key itself was rejected.</b> Open ⚙️ Settings and check the key is pasted exactly (no spaces), is still active in Google AI Studio, and hasn't been restricted to other referrers or APIs.`;
      }
      $('liveResult').innerHTML=`<div style="color:var(--red);padding:14px;background:var(--red-bg);border-radius:8px;font-size:13px"><b>Extraction failed:</b> ${esc(err.message)}<br><br>${hint}</div>`;
    }
  };
  reader.readAsDataURL(file);
}

/* Shared resilient Gemini caller: retry-on-overload + model fallback. Every extraction path uses this. */
async function callGemini(prompt,base64,mimeType){
  const key=getApiKey();
  if(!key)throw new Error('No API key configured');
  const modelsToTry=['gemini-3.6-flash','gemini-2.0-flash','gemini-1.5-flash'];
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  let resp,lastErr,lastStatus;
  outer: for(const model of modelsToTry){
    for(let attempt=0;attempt<2;attempt++){
      try{
        resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:mimeType||'image/jpeg',data:base64}}]}]})
        });
      }catch(networkErr){ throw networkErr; }
      if(resp.ok)break outer;
      lastErr=await resp.text(); lastStatus=resp.status;
      const overloaded=resp.status===503||resp.status===429;
      if(overloaded && attempt===0){ toast('Model busy \u2014 retrying in a moment\u2026'); await sleep(1500); continue; }
      if(resp.status===404 || overloaded){ toast('Switching to a backup model\u2026'); break; }
      break outer;
    }
  }
  if(!resp.ok){const e=new Error('API error '+lastStatus+': '+(lastErr||'').slice(0,200));e.status=lastStatus;throw e}
  const data=await resp.json();
  const text=data.candidates?.[0]?.content?.parts?.[0]?.text;
  if(!text)throw new Error('No response from model');
  return JSON.parse(text.replace(/```json|```/g,'').trim());
}

/* Generic extraction (used for non-invoice documents like PAN / Aadhaar / gate pass) */
async function extractWithGemini(base64,mimeType){
  const prompt=`You are a document data extraction engine. Look at this image/document and identify what type of document it is (e.g. PAN Card, Aadhaar Card, Invoice, Gate Pass, etc). Then extract every meaningful field you can see (names, ID numbers, dates, amounts, addresses, etc).
Respond with ONLY valid JSON, no markdown, no code fences, in exactly this shape:
{"documentType":"...", "party":"short label for whose document this is", "fields":[{"name":"...", "value":"...", "confidence": <integer 0-100 reflecting how legible/certain this field is>}]}
If a field is partially obscured, masked, or hard to read, give it a lower confidence (below 75) rather than guessing confidently. Mask/redact any full unmasked national ID number in your "value" output down to last 4 digits for privacy, even if you can read it fully (e.g. show "XXXX XXXX 8813" not the full number).`;
  return callGemini(prompt,base64,mimeType);
}

/* PASS 1 \u2014 Classify: is it an invoice, and if so which business type? (cheap, no field extraction yet) */
async function classifyWithGemini(base64,mimeType){
  const prompt=`You are a document classifier for an accounts-payable system. Look at this document and decide two things.
1. "category": one of "Invoice", "Credit Note", "Debit Note", "PAN Card", "Aadhaar Card", "Gate Pass", "Shipping Note", "Other".
2. If category is "Invoice", "Credit Note" or "Debit Note", "invoiceType": exactly one of:
   "Material PO Invoice" (raw material, packing material, consumables \u2014 goods with a PO),
   "Service PO Invoice" (calibration, AMC, manpower, consulting, project/maintenance work \u2014 services with a PO, may show an SAC code instead of HSN),
   "Direct / Non-PO Invoice" (utility bills, statutory fees, expenses with no PO),
   "Freight / Logistics Invoice" (transporter, courier, freight forwarder, shipping, airway bills, HWB/AWB, job numbers),
   "Asset / Capex Invoice" (equipment, machinery, capital assets),
   "Subscription / License Invoice" (recurring annual/multi-year software, data, or SaaS subscription fee, tied to an Order Form or contract rather than a PO, often shows a billing period and license/user quantity),
   "Credit Note",
   "Debit Note" (a formal debit note document, often a foreign vendor billing in a foreign currency for regulatory/statutory/renewal fees, no PO, international bank details like IBAN/SWIFT).
   Otherwise invoiceType is null.
3. "party": the vendor / issuer name in a few words.
4. "reason": one short sentence on why you chose this type.
Respond with ONLY valid JSON, no markdown: {"category":"...","invoiceType":"..."|null,"party":"...","reason":"..."}`;
  return callGemini(prompt,base64,mimeType);
}

/* PASS 2 \u2014 Extract ONLY the configured fields of the selected template */
async function extractTemplateWithGemini(base64,mimeType,invoiceType){
  const tpl=INVOICE_TEMPLATES[invoiceType]||INVOICE_TEMPLATES['Material PO Invoice'];
  const fieldList=tpl.map(([n,req])=>`- "${n}"${req?' (mandatory)':' (optional)'}`).join('\n');
  const prompt=`You are extracting a "${invoiceType}" for an SAP accounts-payable system. Extract ONLY the following configured fields \u2014 do not add any other fields, even if the document contains more information:
${fieldList}
For every field in that list return an entry, even if the value is not found (then use value "" and confidence 0). Use the exact field names given. For amounts keep the currency symbol and number as printed. For dates use the format printed on the document.
Respond with ONLY valid JSON, no markdown, no code fences: {"fields":[{"name":"...","value":"...","confidence":<integer 0-100>}]}`;
  const out=await callGemini(prompt,base64,mimeType);
  // keep template order, drop anything the model invented
  const byName={}; (out.fields||[]).forEach(f=>byName[f.name.toLowerCase()]=f);
  return tpl.map(([n])=>{const f=byName[n.toLowerCase()]||{name:n,value:'',confidence:0};return {name:n,value:String(f.value||''),confidence:+f.confidence||0}});
}

function buildEmailContent(p){
  const subject=`Veerai extraction — ${p.result.documentType||'Document'} (${p.result.party||p.fileName})`;
  const avg=Math.round(p.result.fields.reduce((s,f)=>s+(f.confidence||0),0)/p.result.fields.length)||0;
  const lowConf=p.result.fields.filter(f=>(f.confidence||0)<75).map(f=>f.name);
  const bodyLines=[
    `Extracted from: ${p.fileName}`,
    `Document type: ${p.result.documentType||'—'}`,
    `Party: ${p.result.party||'—'}`,
    '',
    ...p.result.fields.map(f=>`${f.name}: ${f.value}`),
    '',
    `Extraction confidence: ${avg}% average${lowConf.length?' — please double-check: '+lowConf.join(', '):' — all fields high-confidence'}`,
    '',
    '— Sent from the Audree live demo.',
  ];
  return {subject,body:bodyLines.join('\n')};
}

/* ---- Real Gmail send via OAuth (Google Identity Services token flow) ---- */
let _gmailTokenClient=null;
function sendViaGmailAPI(){
  const p=window._pendingLiveDoc;
  if(!p){toast('Nothing to send — extract a document first');return}
  const to=($('emailDest').value||'').trim();
  if(!to){toast('Enter a destination email address');return}
  const clientId=getGmailClientId();
  if(!clientId){toast('Add a Gmail OAuth Client ID in ⚙️ Settings first');openSettings();return}
  if(typeof google==='undefined'||!google.accounts){toast('Google sign-in library still loading — try again in a second');return}
  try{
    _gmailTokenClient=google.accounts.oauth2.initTokenClient({
      client_id:clientId,
      scope:'https://www.googleapis.com/auth/gmail.send',
      callback:(resp)=>{
        if(resp.error){toast('Google sign-in failed: '+resp.error);return}
        actuallySendGmail(resp.access_token,to,p);
      }
    });
    _gmailTokenClient.requestAccessToken();
  }catch(e){
    toast('Gmail sign-in error: '+e.message);
  }
}

async function actuallySendGmail(accessToken,to,p){
  toast('Sending via your Gmail account…');
  const {subject,body}=buildEmailContent(p);
  const raw=[
    `To: ${to}`,
    `Subject: ${subject}`,
    'Content-Type: text/plain; charset=utf-8',
    '',
    body
  ].join('\r\n');
  const encoded=btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  try{
    const resp=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{
      method:'POST',
      headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},
      body:JSON.stringify({raw:encoded})
    });
    if(!resp.ok){const t=await resp.text();throw new Error(t.slice(0,200))}
    log('LIVE-EMAIL','Gmail sent','Real email sent to '+to+' via Gmail API','You (live demo)');
    toast('✅ Sent for real via your Gmail account to '+to);
  }catch(e){
    toast('Gmail send failed: '+e.message);
  }
}
