<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audree — AI Business Document Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --ink:#0F1B2D;--ink-2:#1A2A42;--paper:#F5F7F9;--card:#FFF;--line:#DCE3EA;
  --text:#22303F;--muted:#66788A;
  --teal:#0E7C66;--teal-bg:#E4F3EF;--amber:#B4720F;--amber-bg:#FBF1DE;
  --red:#B3382C;--red-bg:#F9E9E7;--blue:#2456C4;--blue-bg:#E8EEFB;
  --violet:#6A45B8;--violet-bg:#EFE9FA;--radius:10px;--mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--text);font-size:13.5px;line-height:1.5}
h1,h2,h3,.brand{font-family:'Sora',sans-serif}
button{font:inherit;cursor:pointer;border:none;background:none}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:230px;min-width:230px;background:var(--ink);color:#C6D2E0;display:flex;flex-direction:column}
.brand{padding:20px 18px 14px;color:#fff;font-size:19px;font-weight:700;display:flex;align-items:center;gap:9px}
.brand .dot{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,#3D7BFF,#0E7C66)}
.brand small{font-family:'Inter';font-size:10px;font-weight:500;color:#7E93AC;display:block;letter-spacing:1.4px;text-transform:uppercase}
.nav{padding:8px 10px;flex:1;overflow:auto}
.nav .group{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:#5F7490;margin:16px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;color:#C6D2E0;font-size:13px;text-align:left;margin-bottom:2px}
.nav button:hover{background:var(--ink-2)}
.nav button.active{background:var(--ink-2);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--teal)}
.nav .badge{margin-left:auto;background:var(--amber);color:#fff;font-size:10.5px;font-weight:600;border-radius:9px;padding:1px 7px}
.user{padding:14px 18px;border-top:1px solid #24344D;font-size:12px}
.user b{color:#fff;display:block}
.main{flex:1;overflow:auto;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar h1{font-size:16.5px;color:var(--ink)}
.topbar .sub{color:var(--muted);font-size:12px}
.content{padding:20px 24px 40px;max-width:1440px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2.5px 9px;border-radius:20px;white-space:nowrap}
.chip.teal{background:var(--teal-bg);color:var(--teal)}.chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.red{background:var(--red-bg);color:var(--red)}.chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.violet{background:var(--violet-bg);color:var(--violet)}.chip.grey{background:#EDF1F5;color:var(--muted)}
.btn{padding:8px 15px;border-radius:8px;font-weight:600;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--text)}
.btn:hover{border-color:#B9C4CF}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.primary:hover{background:#0A6853}
.btn.danger{background:#fff;border-color:var(--red);color:var(--red)}.btn.danger:hover{background:var(--red-bg)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{border-color:transparent;color:var(--blue)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:#FAFBFC}
td{padding:10px 14px;border-bottom:1px solid #EDF1F5;vertical-align:middle}
tr.row:hover td{background:#F6F9FC;cursor:pointer}
.mono{font-family:var(--mono);font-size:12px}
.stat{padding:16px 18px}
.stat .n{font-family:'Sora';font-size:26px;font-weight:700;color:var(--ink)}
.stat .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
.grid{display:grid;gap:14px}
.section-title{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff;color:var(--text)}
input:focus,select:focus{outline:2px solid var(--blue-bg);border-color:var(--blue)}
label{font-size:11.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
.filterbar>div{min-width:160px}
.conf{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:500}
.conf .bar{width:44px;height:5px;background:#E6EBF0;border-radius:3px;overflow:hidden}
.conf .bar i{display:block;height:100%;border-radius:3px}
.conf.hi{color:var(--teal)}.conf.hi .bar i{background:var(--teal)}
.conf.md{color:var(--amber)}.conf.md .bar i{background:var(--amber)}
.conf.lo{color:var(--red)}.conf.lo .bar i{background:var(--red)}
.pipe{display:flex;align-items:center;overflow-x:auto;padding:14px 18px}
.pipe .st{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.pipe .st .ic{width:22px;height:22px;border-radius:50%;background:#E9EEF3;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--mono)}
.pipe .st.done{color:var(--teal)}.pipe .st.done .ic{background:var(--teal);color:#fff}
.pipe .st.now{color:var(--ink)}.pipe .st.now .ic{background:var(--blue);color:#fff;box-shadow:0 0 0 4px var(--blue-bg)}
.pipe .ln{width:30px;height:2px;background:var(--line);margin:0 8px;flex:none}
.pipe .ln.done{background:var(--teal)}
.detail{display:grid;grid-template-columns:minmax(340px,1.05fr) minmax(400px,1.3fr);gap:16px;align-items:start}
/* --- original document renderings --- */
.viewtabs{display:flex;gap:6px;margin-bottom:8px}
.viewtabs button{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);background:#fff}
.viewtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pdfframe{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#525659}
.pdfbar{background:#3C4043;color:#E8EAED;font-size:11.5px;padding:7px 12px;display:flex;justify-content:space-between;font-family:var(--mono)}
.pdfpage{background:#fff;margin:16px auto;width:88%;min-height:340px;box-shadow:0 4px 14px rgba(0,0,0,.45);padding:22px 24px;font-size:12px}
.photowrap{border:1px solid var(--line);border-radius:var(--radius);background:radial-gradient(circle at 30% 20%,#8A7A66,#5C5044);padding:26px;display:flex;justify-content:center}
.photo{background:#FDFDF8;width:86%;padding:16px 18px;transform:rotate(-2.2deg);box-shadow:0 10px 22px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.08);font-size:12px}
.photo.card-doc{width:66%;border-radius:10px;background:linear-gradient(135deg,#EAF2FB,#FDFDF8 55%)}
.photo .flash{position:relative}
.hl{background:#FFF3CE;border-bottom:1.5px dashed var(--amber);padding:0 2px;border-radius:2px}
.dochead{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:10px}
/* --- WhatsApp panel --- */
.wa{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.wa .wahead{background:#075E54;color:#fff;padding:9px 14px;font-size:12.5px;display:flex;align-items:center;gap:9px}
.wa .wahead .av{width:26px;height:26px;border-radius:50%;background:#128C7E;display:flex;align-items:center;justify-content:center;font-weight:700}
.wa .wabody{background:#E5DDD5;padding:12px;max-height:280px;overflow:auto}
.wamsg{max-width:82%;background:#fff;border-radius:8px;padding:7px 10px;margin-bottom:7px;font-size:12.5px;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.wamsg.me{margin-left:auto;background:#DCF8C6}
.wamsg .who{font-size:10.5px;color:#128C7E;font-weight:700;margin-bottom:1px}
.wamsg .tm{font-size:9.5px;color:#8696A0;text-align:right;margin-top:2px}
.wamsg .att{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.05);border-radius:6px;padding:7px 9px;margin:3px 0;font-size:12px;cursor:pointer}
.wamsg .att .fic{font-size:19px}
.wafoot{display:flex;gap:8px;padding:9px;background:#F0F2F5}
.wafoot input{border-radius:20px;padding:8px 14px}
.wafoot button{background:#075E54;color:#fff;width:38px;height:38px;border-radius:50%;flex:none;font-size:15px}
.emailthread{padding:12px 14px;font-size:12.5px}
.fieldrow{display:grid;grid-template-columns:1.1fr 1.4fr auto;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid #EDF1F5}
.fieldrow:hover{background:#FAFCFE}
.fieldrow .fname{font-size:12px;font-weight:600;color:var(--muted)}
.fieldrow input{padding:6px 9px;font-size:12.5px}
.fieldrow.err input{border-color:var(--red);background:#FFF7F6}
.valrow{display:flex;gap:10px;padding:9px 14px;border-bottom:1px solid #EDF1F5;font-size:12.5px;align-items:flex-start}
.valrow .vic{width:18px;height:18px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;margin-top:1px}
.valrow.pass .vic{background:var(--teal)}.valrow.fail .vic{background:var(--red)}.valrow.warn .vic{background:var(--amber)}
.valrow small{color:var(--muted);display:block}
.actionbar{display:flex;gap:9px;flex-wrap:wrap;padding:14px;border-top:1px solid var(--line);background:#FAFBFC;border-radius:0 0 var(--radius) var(--radius)}
.route-step{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid #EDF1F5;font-size:12.5px}
.route-step .rdot{width:11px;height:11px;border-radius:50%;background:var(--line);margin-top:4px;flex:none}
.route-step.done .rdot{background:var(--teal)}.route-step.now .rdot{background:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(15,27,45,.35);opacity:0;transform:translateY(8px);transition:.25s;z-index:99;max-width:380px}
.toast.show{opacity:1;transform:none}
.wiz{display:flex;overflow-x:auto;margin-bottom:18px}
.wiz button{display:flex;flex-direction:column;gap:3px;padding:10px 14px;border-bottom:3px solid var(--line);font-size:12px;color:var(--muted);min-width:104px;text-align:left}
.wiz button b{font-size:12.5px;color:inherit}
.wiz button .n{font-family:var(--mono);font-size:10px}
.wiz button.active{border-color:var(--blue);color:var(--ink)}
.wiz button.done{border-color:var(--teal);color:var(--teal)}
.rulecard{border:1px solid var(--line);border-radius:8px;padding:10px 13px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12.5px;background:#fff}
.addform{background:#F7FAFD;border:1px dashed #B9CBE4;border-radius:10px;padding:14px;margin-top:10px}
.addform .fr{display:grid;gap:10px;margin-bottom:10px}
.proc-item{padding:12px 14px;border-bottom:1px solid #EDF1F5;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.proc-item:hover{background:#F6F9FC}
.proc-item.sel{background:var(--blue-bg);box-shadow:inset 3px 0 0 var(--blue)}
.vbars{display:flex;align-items:flex-end;gap:18px;height:150px;padding:6px 8px 0}
.vbars .vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.vbars .vb .col{width:100%;max-width:52px;background:linear-gradient(180deg,#3D7BFF,var(--blue));border-radius:6px 6px 0 0;position:relative}
.vbars .vb .col.due{background:linear-gradient(180deg,#E09A2F,var(--amber))}
.vbars .vb .val{font-family:var(--mono);font-size:10.5px;color:var(--ink);font-weight:600}
.vbars .vb .mo{font-size:11px;color:var(--muted);font-weight:600}
.bar-h{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px}
.bar-h .lbl{width:118px;color:var(--muted)}
.bar-h .trk{flex:1;height:9px;background:#E9EEF3;border-radius:5px;overflow:hidden}
.bar-h .trk i{display:block;height:100%;background:var(--blue);border-radius:5px}
.bar-h .v{font-family:var(--mono);width:40px;text-align:right}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:1000px){.detail{grid-template-columns:1fr}.sidebar{width:64px;min-width:64px}.sidebar .brand small,.sidebar .nav span.t,.sidebar .user,.nav .group{display:none}.brand{justify-content:center;font-size:0}.brand .dot{width:16px;height:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,27,45,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .mhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .mhead h3{font-size:16px;color:var(--ink)}
.modal .mbody{padding:20px}
.modal .mfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:30px 20px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
.dropzone:hover,.dropzone.drag{border-color:var(--blue);background:var(--blue-bg)}
.extract-preview{max-width:100%;max-height:220px;border-radius:8px;margin:0 auto 14px;display:block;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.spinner{width:34px;height:34px;border:3px solid #E6EBF0;border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.livefield{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #EDF1F5;font-size:13px}
.livefield b{color:var(--ink)}
</style>

</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><span>Audree<small>AI Business Platform</small></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="user"><b>Priya Nair</b>Shared Services · Reviewer + Owner</div>
  </aside>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ CORE DATA MODEL ============ */
const FUNCS=['Finance','HR','Legal','Logistics','Manufacturing','Quality','Healthcare'];
const TARGETS=['SAP S/4HANA — FI (MIRO)','SAP MM','HRMS (Workday / SAP HCM)','WMS','MES','LIMS','HIMS','DMS only'];
const CHECKTYPES=['Master data lookup','Duplicate check','PO / GRN match','Regex / format','Govt API (GSTN · NSDL · UIDAI)','Value recompute','Range / spec check','Custom condition'];
const USERS=['Priya Nair (Finance)','Arjun Rao (Finance Mgr)','Meera Shah (HR)','Vikram Iyer (Legal)','Sana Qureshi (Logistics)','Naveen Kulkarni (Production)','Dr. Rohit Menon (QA)'];

/* Every document type is a configurable PROCESS: any function, any template, any fields, any target */
const state={
  view:'inbox',selDoc:null,selProc:0,ownerStep:0,mastersTab:0,selMaster:0,
  filters:{func:'All',type:'All',status:'All',channel:'All'},
  processes:[
    proc('P-FIN-01','Vendor Invoice — India GST','Finance','Invoice',['Email','WhatsApp','Vendor portal'],
      tpl('Tax Invoice (GST)',40),
      [pf('Vendor GSTIN','Regex + GSTN API',true,null),pf('Invoice No','Text',true,null),pf('Invoice Date','Date',true,null),pf('PO Reference','Master lookup',false,['Vendor PO Master','PO No']),pf('Taxable Value','Currency',true,null),pf('Total Amount','Currency',true,null)],
      [pr('Duplicate check','Duplicate check','Invoice No + Vendor + Amount within 365 days','Block'),pr('3-way match','PO / GRN match','PO qty vs GRN vs invoice, tolerance 2%','Exception'),pr('GSTIN active','Govt API (GSTN · NSDL · UIDAI)','GSTN portal status = Active','Block'),pr('Tax recompute','Value recompute','Rate × taxable vs extracted tax','Exception')],
      [rt('Amount ≤ ₹2,00,000','AP Desk → Auto-post'),rt('Amount > ₹2,00,000','AP Desk → Finance Manager')],
      'SAP S/4HANA — FI (MIRO)',true,true),
    proc('P-HR-01','Employee KYC — PAN Card','HR','PAN Card',['WhatsApp','Email'],
      tpl('PAN Card (photo)',24),
      [pf('Name on card','Text',true,['Employee Master','Full Name']),pf("Father's Name",'Text',false,null),pf('Date of Birth','Date',true,['Employee Master','DOB']),pf('PAN Number','Regex + NSDL API',true,null)],
      [pr('PAN format','Regex / format','[A-Z]{5}[0-9]{4}[A-Z]','Block'),pr('NSDL status','Govt API (GSTN · NSDL · UIDAI)','PAN active on NSDL','Block'),pr('Name match','Master data lookup','Fuzzy match ≥ 90% vs Employee Master','Exception'),pr('Image quality','Custom condition','Blur / glare score below threshold','Exception')],
      [rt('All documents','HR Ops → HR Manager')],'HRMS (Workday / SAP HCM)',true,true),
    proc('P-HR-02','Employee KYC — Aadhaar','HR','Aadhaar Card',['WhatsApp'],
      tpl('Aadhaar (masked photo)',18),
      [pf('Name','Text',true,['Employee Master','Full Name']),pf('Aadhaar (last 4)','Masked number',true,null),pf('DOB / YOB','Date',true,['Employee Master','DOB']),pf('Address','Text',false,null)],
      [pr('Mask compliance','Custom condition','First 8 digits must be masked (UIDAI norm)','Block'),pr('Verhoeff checksum','Regex / format','Aadhaar checksum valid','Block'),pr('Employee match','Master data lookup','Name + DOB vs Employee Master','Exception')],
      [rt('All documents','HR Ops → HR Manager')],'HRMS (Workday / SAP HCM)',true,true),
    proc('P-LOG-01','Gate Pass — Inbound','Logistics','Gate Pass',['WhatsApp','Email'],
      tpl('Gate Pass (security format)',15),
      [pf('Gate Pass No','Text',true,null),pf('Vehicle No','Regex',true,null),pf('Transporter','Master lookup',true,['Transporter Master','Name']),pf('PO Reference','Master lookup',false,['Vendor PO Master','PO No']),pf('Material / Qty','Text',true,null)],
      [pr('Transporter registered','Master data lookup','Exists + active in Transporter Master','Block'),pr('Vehicle format','Regex / format','Indian RTO plate pattern','Warn'),pr('Open PO','PO / GRN match','PO open with pending qty','Exception')],
      [rt('All documents','Security Desk → Stores → Auto GRN trigger')],'WMS',true,true),
    proc('P-LOG-02','Shipping Note — Outbound','Logistics','Shipping Note',['Email'],
      tpl('Shipping Note',12),
      [pf('SN Number','Text',true,null),pf('Consignee','Text',true,null),pf('Dispatch Qty','Number',true,null),pf('Carrier','Master lookup',true,['Transporter Master','Name'])],
      [pr('Stock available','Master data lookup','Qty ≤ unrestricted stock','Block'),pr('Duplicate SN','Duplicate check','SN number, 180 days','Block')],
      [rt('All documents','Dispatch Desk → Logistics Manager')],'WMS',true,true),
    proc('P-MFG-01','BMR Extract → MES','Manufacturing','BMR',['SFTP','Email'],
      tpl('Batch Manufacturing Record',30),
      [pf('Batch No','Master lookup',true,['Batch Master','Batch No']),pf('Product','Master lookup',true,['Batch Master','Product']),pf('Actual Yield %','Number',true,null),pf('Deviations','Number',true,null),pf('Mfg Start / End','Date range',true,null)],
      [pr('Batch exists','Master data lookup','Batch No in Batch Master, status in-process','Block'),pr('Yield in range','Range / spec check','Yield 92–102% of standard','Exception'),pr('Deviation closure','Custom condition','All deviations closed before release','Block')],
      [rt('All documents','Production Officer → QA Release')],'MES',true,true),
    proc('P-HSP-01','OPD Sheet → HIMS','Healthcare','OPD Sheet',['Scan station','WhatsApp'],
      tpl('Handwritten OPD register',35),
      [pf('UHID','Master lookup',true,['Patient Master','UHID']),pf('Patient Name','Text',true,['Patient Master','Patient Name']),pf('Diagnosis','Text',true,null),pf('Medication (as written)','Master lookup',true,['Drug Synonym Master','Alias (as written)']),pf('Dosage / Frequency','Text',true,null)],
      [pr('Patient exists','Master data lookup','UHID live-checked in HIMS before posting','Block'),pr('Drug normalization','Master data lookup','Brand/local name → canonical generic + HIMS code via Drug Synonym Master','Block'),pr('Dosage plausibility','Range / spec check','Dose within formulary min–max for the canonical drug','Exception'),pr('Handwriting confidence','Custom condition','Any clinical field < 85% forces human review','Exception')],

function act(id,kind){
  const d=state.docs.find(x=>x.id===id);const p=procById(d.procId);
  if(kind==='approve'){
    if(d.routePos<d.route.length-1){d.status='routing';d.routePos++;log(id,'Approved (level '+d.routePos+')','Routed to: '+d.route[d.routePos]);toast('Approved — routed to '+d.route[d.routePos])}

  render();
}

function showModal(title,bodyHtml,buttons){
  closeModal();
  const bd=document.createElement('div');bd.className='modal-backdrop';bd.id='activeModal';
  bd.innerHTML=`<div class="modal"><div class="mhead"><h3>${title}</h3><button class="btn ghost" style="padding:2px 8px" onclick="closeModal()">✕</button></div>
   <div class="mbody">${bodyHtml}</div>
   <div class="mfoot" id="modalFoot"></div></div>`;
  document.body.appendChild(bd);
  bd.addEventListener('click',e=>{if(e.target===bd)closeModal()});
  const foot=$('modalFoot');
  buttons.forEach(b=>{const btn=document.createElement('button');btn.className=b.cls;btn.textContent=b.label;btn.onclick=b.action||closeModal;foot.appendChild(btn)});
}
function closeModal(){const m=$('activeModal');if(m)m.remove()}

async function handleLiveFile(file){
  if(!file)return;
  if(!getApiKey()){
    $('liveResult').innerHTML=`<div style="color:var(--red);padding:14px;background:var(--red-bg);border-radius:8px;font-size:13px"><b>No API key set.</b> Open ⚙️ Settings and paste your free key first — it didn't seem to save last time. Try pasting it, clicking Save, then reopening Settings to confirm it still shows.</div>`;
    return;
  }
  const isPdf=file.type==='application/pdf';
  const reader=new FileReader();
  reader.onload=async()=>{
    const base64=reader.result.split(',')[1];
    $('liveResult').innerHTML=`
     ${isPdf?'<div style="text-align:center;color:var(--muted);margin-bottom:10px">📄 '+esc(file.name)+'</div>':`<img class="extract-preview" src="${reader.result}">`}
     <div class="spinner"></div>
     <div style="text-align:center;color:var(--muted);font-size:13px">Veerai is reading the document…</div>`;
    try{
      const fields=await extractWithGemini(base64,file.type);
      renderLiveResult(fields,reader.result,file.name,isPdf);
    }catch(err){
      const isFileProtocol=window.location.protocol==='file:';
      const isNetworkFail=err instanceof TypeError && /fetch/i.test(err.message);
      let hint='Check that your API key (⚙️ settings) is valid and has quota remaining.';
      if(isNetworkFail && isFileProtocol){
        hint=`<b>Likely cause:</b> you opened this file directly from disk (file://…). Google's API blocks requests from local files for security. <b>Fix:</b> host this file on a real URL — drag it onto <a href="https://app.netlify.com/drop" target="_blank" style="color:var(--blue)">app.netlify.com/drop</a> (free, 30 seconds) and open it from the URL it gives you instead of double-clicking the file.`;
      }else if(isNetworkFail){
        hint='This looks like a network/CORS-level failure rather than an API error — check your internet connection, and confirm this page is loaded from a real https:// URL rather than a local file.';
      }
      $('liveResult').innerHTML=`<div style="color:var(--red);padding:14px;background:var(--red-bg);border-radius:8px;font-size:13px"><b>Extraction failed:</b> ${esc(err.message)}<br><br>${hint}</div>`;
    }
  };
  reader.readAsDataURL(file);
}

async function extractWithGemini(base64,mimeType){
  const key=getApiKey();
  if(!key)throw new Error('No API key configured');
  const prompt=`You are a document data extraction engine. Look at this image/document and identify what type of document it is (e.g. PAN Card, Aadhaar Card, Invoice, Gate Pass, etc). Then extract every meaningful field you can see (names, ID numbers, dates, amounts, addresses, etc).
Respond with ONLY valid JSON, no markdown, no code fences, in exactly this shape:
{"documentType":"...", "party":"short label for whose document this is", "fields":[{"name":"...", "value":"...", "confidence": <integer 0-100 reflecting how legible/certain this field is>}]}
If a field is partially obscured, masked, or hard to read, give it a lower confidence (below 75) rather than guessing confidently. Mask/redact any full unmasked national ID number in your "value" output down to last 4 digits for privacy, even if you can read it fully (e.g. show "XXXX XXXX 8813" not the full number).`;
  const modelsToTry=['gemini-3.6-flash','gemini-2.0-flash','gemini-1.5-flash'];
  let resp,lastErr;
  for(const model of modelsToTry){
    try{
      resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:mimeType||'image/jpeg',data:base64}}]}]})
      });
    }catch(networkErr){
      throw networkErr; // propagate TypeError("Failed to fetch") as-is so the caller can detect it specifically
    }
    if(resp.ok)break;
    lastErr=await resp.text();
    if(resp.status!==404)break; // only fall through to next model on "model not found/retired"
  }
  if(!resp.ok){throw new Error('API error '+resp.status+': '+(lastErr||'').slice(0,200))}
  const data=await resp.json();
  const text=data.candidates?.[0]?.content?.parts?.[0]?.text;
  if(!text)throw new Error('No response from model');
  const clean=text.replace(/```json|```/g,'').trim();
  return JSON.parse(clean);
}

function renderLiveResult(result,dataUrl,fileName,isPdf){
  window._pendingLiveDoc={result,fileName,isPdf};
  const avg=Math.round(result.fields.reduce((s,f)=>s+f.confidence,0)/result.fields.length)||0;
  $('liveResult').innerHTML=`
   ${isPdf?'':`<img class="extract-preview" src="${dataUrl}">`}
   <div style="text-align:center;margin-bottom:10px">
     <span class="chip blue">${esc(result.documentType||'Document')}</span>
     <span class="chip ${avg>=90?'teal':avg>=75?'amber':'red'}">Avg confidence ${avg}%</span>
   </div>
   <div class="card" style="padding:4px 14px;margin-bottom:14px">
     ${result.fields.map(f=>`<div class="livefield"><span>${esc(f.name)}</span>${confHtml(f.confidence)}</div><div class="livefield" style="border-bottom:1px solid #F3F5F7;padding-top:0"><b>${esc(f.value)}</b></div>`).join('')}
   </div>
   <button class="btn primary" style="width:100%;margin-bottom:10px" onclick="addLiveDocument()">➕ Add to Inbox as a live document</button>
   <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
     <input id="emailDest" value="sj.audree@gmail.com" placeholder="destination email" style="flex:1">
   </div>
   <div style="display:flex;gap:8px;margin-bottom:6px">
     <button class="btn" style="flex:1" onclick="emailExtractedData()">✉️ Open in email app</button>
     <button class="btn blue" style="flex:1" onclick="sendViaGmailAPI()">📨 Send via Gmail (real)</button>
   </div>
   <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:8px">This was extracted live by Veerai — not pre-scripted demo data. "Open in email app" pre-fills a draft you send yourself. "Send via Gmail" actually sends it through your own authorized Gmail account (one-time Google sign-in), with your explicit consent each time.</div>`;
}

function buildEmailContent(p){
  const subject=`Veerai extraction — ${p.result.documentType||'Document'} (${p.result.party||p.fileName})`;
  const bodyLines=[
    `Extracted live by Veerai from: ${p.fileName}`,
    `Document type: ${p.result.documentType||'—'}`,
    `Party: ${p.result.party||'—'}`,
    '',
    ...p.result.fields.map(f=>`${f.name}: ${f.value}  (confidence ${f.confidence}%)`),
    '',
    '— Sent from the Audree / Veerai live demo.',
  ];
  return {subject,body:bodyLines.join('\n')};
}

/* ---- Real Gmail send via OAuth (Google Identity Services token flow) ---- */
let _gmailTokenClient=null;
function sendViaGmailAPI(){
  const p=window._pendingLiveDoc;
  if(!p){toast('Nothing to send — extract a document first');return}
  const to=($('emailDest').value||'').trim();
  if(!to){toast('Enter a destination email address');return}
  const clientId=getGmailClientId();
  if(!clientId){toast('Add a Gmail OAuth Client ID in ⚙️ Settings first');openSettings();return}
  if(typeof google==='undefined'||!google.accounts){toast('Google sign-in library still loading — try again in a second');return}
  try{
    _gmailTokenClient=google.accounts.oauth2.initTokenClient({
      client_id:clientId,
      scope:'https://www.googleapis.com/auth/gmail.send',
      callback:(resp)=>{
        if(resp.error){toast('Google sign-in failed: '+resp.error);return}
        actuallySendGmail(resp.access_token,to,p);
      }
    });
    _gmailTokenClient.requestAccessToken();
  }catch(e){
    toast('Gmail sign-in error: '+e.message);
  }
}

async function actuallySendGmail(accessToken,to,p){
  toast('Sending via your Gmail account…');
  const {subject,body}=buildEmailContent(p);
  const raw=[
    `To: ${to}`,
    `Subject: ${subject}`,
    'Content-Type: text/plain; charset=utf-8',
    '',
    body
  ].join('\r\n');
  const encoded=btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  try{
    const resp=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{
      method:'POST',
      headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},
      body:JSON.stringify({raw:encoded})
    });
    if(!resp.ok){const t=await resp.text();throw new Error(t.slice(0,200))}
    log('LIVE-EMAIL','Gmail sent','Real email sent to '+to+' via Gmail API','You (live demo)');
    toast('✅ Sent for real via your Gmail account to '+to);
  }catch(e){
    toast('Gmail send failed: '+e.message);
  }
}

function emailExtractedData(){
  const p=window._pendingLiveDoc;
  if(!p){toast('Nothing to email — extract a document first');return}
  const to=($('emailDest').value||'').trim();
  if(!to){toast('Enter a destination email address');return}
  const {subject,body}=buildEmailContent(p);
  const mailto=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href=mailto;
  log('LIVE-EMAIL','Email draft opened','Extracted data from '+p.fileName+' drafted to '+to,'You (live demo)');
  toast('Opening your email app with the extracted data pre-filled…');
}

let liveDocCounter=1;
function addLiveDocument(){
  if(!window._pendingLiveDoc){toast('Nothing to add — extract a document first');return}
  const {result,fileName,isPdf}=window._pendingLiveDoc;
  const id='LIVE-'+String(liveDocCounter++).padStart(3,'0');
  const avg=Math.round(result.fields.reduce((s,f)=>s+f.confidence,0)/result.fields.length)||0;
  const newDoc={
    id,procId:'P-LIVE',func:'Live Demo',type:result.documentType||'Document',party:result.party||'Live upload',
    channel:'Live Upload',status:avg<80?'exception':'pending',amount:'—',received:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),
    attachment:{kind:isPdf?'pdf':'image',name:fileName,pages:1},
    fields:result.fields.map(f=>({name:f.name,value:f.value,conf:f.confidence,edited:false})),
    checks:[{s:avg>=85?'pass':'warn',name:'Live extraction quality',detail:'Average field confidence '+avg+'% from a real, unscripted document'}],
    route:['Reviewer','Approve'],routePos:0,
    chat:[{who:'You (live demo)',text:'Uploaded live during demo — genuinely extracted by Veerai, not pre-loaded data.',att:{kind:isPdf?'pdf':'image',name:fileName},tm:'now'}],
  };
  if(!state.processes.find(p=>p.id==='P-LIVE'))state.processes.push({id:'P-LIVE',name:'Live Demo Upload',func:'Live Demo',docType:'Any',target:'Demo only — not posted anywhere',fields:[],rules:[],route:[]});
  state.docs.unshift(newDoc);
  window._pendingLiveDoc=null;
  closeModal();
  toast('Live document added to Inbox — open '+id+' to review');
  openDoc(id);
}

/* ============ RENDER ============ */
function render(){renderNav();({inbox:renderInbox,doc:renderDocView,audit:renderAudit,studio:renderStudio,masters:renderMasters}[state.view]||renderInbox)()}
render();
</script>
